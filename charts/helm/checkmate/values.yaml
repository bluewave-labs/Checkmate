# Checkmate is published as a single all-in-one application image: the API server
# also serves the React client, so one deployment and one ingress cover both.
# The `client:` and `api:` blocks from chart 0.2.x are still read for back-compat
# (see templates/_helpers.tpl) — `app.*` is the block to set on new installs.
app:
  image: ghcr.io/bluewave-labs/checkmate
  tag: "" # defaults to Chart.appVersion; set a full repo:tag in `image` to pin (e.g. a :latest dev tag)
  imagePullPolicy: IfNotPresent # IfNotPresent so kind-loaded :latest images are used (not pulled)
  port: 52345
  protocol: http
  resources: {}
  affinity: {}
  tolerations: {}
  # Liveness/readiness probes hit GET /api/v1/health on the app port (proves the HTTP server is up).
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  ingress:
    enabled: true
    host: change_me
    className: nginx
    annotations: {}
    # Example annotations for cert-manager:
    # annotations:
    #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls:
      enabled: false
      # secretName: {{ .Release.Name }}-tls  # Optional; defaults to <release>-tls if omitted
      # Note: when enabling TLS, also set app.protocol: https and add
      # a cert-manager issuer annotation (e.g. cert-manager.io/cluster-issuer: "letsencrypt-prod").
      # The secret will be automatically created by cert-manager when using the cert-manager.io/cluster-issuer annotation

# Upstream MongoDB. The former ghcr.io/bluewave-labs/checkmate-mongo image is no
# longer published; this matches the mongo version in docker/docker-compose.yaml.
mongodb:
  image: mongo
  tag: "8.0"
  imagePullPolicy: IfNotPresent
  port: 27017

worker:
  # Off by default; existing installs are unchanged. When true, a dedicated worker processes all
  # jobs and the app stops processing (QUEUE_PRIMARY_PROCESSES is derived as false). When false, the
  # app is all-in-one and processes jobs itself.
  enabled: false
  image: "" # defaults to app.image when empty, same as the application image
  tag: "" # defaults to app.tag (-> Chart.appVersion) when empty
  imagePullPolicy: "" # defaults to app.imagePullPolicy when empty
  replicas: 1 # used only when autoscaling.enabled = false
  healthPort: 52346 # HEALTH_PORT; serves /livez /readyz /metrics
  terminationGracePeriodSeconds: 30 # MUST stay > the server drain timeout (25s) or workers are killed mid-drain
  resources: {}
  affinity: {}
  tolerations: {}
  probes:
    liveness: # /livez — failureThreshold>=3 so one slow tick never restarts mid-job
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness: # /readyz — flips to 503 on drain
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false # requires the KEDA operator installed in-cluster
    minReplicaCount: 1 # processing floor — never 0 (a cold gap silently stops checks)
    maxReplicaCount: 10
    backlogPerReplica: 50 # KEDA queryValue: target due-backlog per worker
    cooldownPeriod: 300 # seconds before scaling an idle target down
    stabilizationWindowSeconds: 300 # damp the interval-boundary herd
    mongo:
      dbName: uptime_db # must match DB_CONNECTION_STRING's database
      collection: jobs

secrets:
  JWT_SECRET: change_me
  DB_CONNECTION_STRING: mongodb://checkmate-mongodb:27017/uptime_db
  # CLIENT_HOST is derived from app.protocol + app.ingress.host by the deployment;
  # set it here only to override that (e.g. when fronting the app with another proxy).
  NODE_ENV: production
  LOG_LEVEL: info
  TOKEN_TTL: 99d

persistence:
  mongo:
    size: 5Gi
    storageClass: ""
