{{- $api := include "checkmate.api" . | fromYaml -}}
{{- if $api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkmate-api-ingress
  {{- if $api.ingress.annotations }}
  annotations:
    {{- range $key, $value := $api.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $api.ingress.className }}
  {{- if $api.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $api.ingress.host }}
      secretName: {{ default (printf "%s-api-tls" .Release.Name) $api.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $api.ingress.host }}
      http:
        paths:
          # Chart 0.3.0+: the all-in-one image serves the SPA, /config.js, /api-docs and
          # /api/v1 from one process, so a single root rule covers the UI and the API.
          # (The client ingress that used to serve "/" was removed with the client tier.)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkmate-api
                port:
                  number: {{ $api.port }}
{{- end }}
