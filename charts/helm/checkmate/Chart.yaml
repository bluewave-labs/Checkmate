apiVersion: v2
name: checkmate-chart
description: A Helm chart for Checkmate App
type: application
version: 0.3.0
# This chart deploys the all-in-one image (ghcr.io/bluewave-labs/checkmate), which serves the
# client UI and the API from one container. appVersion tracks Checkmate releases: bump it
# (together with `version`) to update the app. MongoDB is upstream `mongo` — its tag is set in
# values.yaml (mongodb.tag) and is intentionally independent of appVersion.
appVersion: "v3.11.0" # "v" prefix: published image tags are v-prefixed (ghcr.io/bluewave-labs/checkmate:v3.11.0)
