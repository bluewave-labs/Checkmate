# Optional Checkmate Connect sidecar.
#
# Adds the Connect agent next to Checkmate and points the server's
# Settings -> Checkmate Connect tab at it. Nothing listens on a new host
# port: the agent's admin API stays on the internal compose network, and
# the agent only ever dials out (wss) to Checkmate Connect.
#
# Usage:
#   CONNECT_ADMIN_TOKEN=$(openssl rand -hex 24)
#   export CONNECT_ADMIN_TOKEN
#   docker compose -f docker-compose.yaml -f docker-compose.connect.yaml up -d
#
# The same CONNECT_ADMIN_TOKEN must reach both services; it authenticates
# the Checkmate server to the agent's local admin API.

services:
  checkmate:
    environment:
      - CONNECT_AGENT_URL=http://connect-agent:52400
      - CONNECT_ADMIN_TOKEN=${CONNECT_ADMIN_TOKEN:?set CONNECT_ADMIN_TOKEN in your environment}

  connect-agent:
    image: ghcr.io/bluewave-labs/checkmate-connect-agent:latest
    restart: always
    environment:
      - CHECKMATE_URL=http://checkmate:52345
      - CONNECT_ADMIN_TOKEN=${CONNECT_ADMIN_TOKEN:?set CONNECT_ADMIN_TOKEN in your environment}
      # Enrollment is limited to connect.checkmate.so. For a staging or
      # preview Connect deployment, allow its hostname explicitly:
      # - CONNECT_ALLOWED_HOSTS=my-preview-host.example.com
    volumes:
      - connect-agent-data:/data

volumes:
  connect-agent-data:
