name: PR Size Check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    env:
      MAX_LINES: 600
      MAX_FILES: 30
      OVERRIDE_LABEL: large-pr-approved
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const maxLines = Number(process.env.MAX_LINES);
            const maxFiles = Number(process.env.MAX_FILES);
            const overrideLabel = process.env.OVERRIDE_LABEL;
            const excluded = [/(^|\/)package-lock\.json$/, /(^|\/)locales\/[^/]+\.json$/];

            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const counted = files.filter((file) => !excluded.some((pattern) => pattern.test(file.filename)));
            const lines = counted.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const summary = `${lines} changed lines in ${counted.length} files (limits: ${maxLines} lines, ${maxFiles} files; lockfiles and locale files are not counted)`;

            if (lines <= maxLines && counted.length <= maxFiles) {
              core.info(`PR size is within limits: ${summary}.`);
              return;
            }

            if (pr.labels.some((label) => label.name === overrideLabel)) {
              core.notice(`PR is over the size limits but has the "${overrideLabel}" label: ${summary}.`);
              return;
            }

            core.setFailed(
              `PR is too large to review: ${summary}. Split it into smaller PRs, or ask a maintainer to add the "${overrideLabel}" label.`
            );
