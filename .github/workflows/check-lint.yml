name: Lint Check (Client)
on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Lint client
        working-directory: client
        run: npm run lint
